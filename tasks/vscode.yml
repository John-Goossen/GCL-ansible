---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - wget
      - gpg
      - apt-transport-https
    state: present
    update_cache: true

- name: Download Microsoft signing key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /usr/share/keyrings/microsoft.asc
    mode: '0644'

- name: Convert Microsoft key to keyring format
  ansible.builtin.command:
    cmd: >
      gpg --dearmor
      -o /usr/share/keyrings/microsoft.gpg
      /usr/share/keyrings/microsoft.asc
  args:
    creates: /usr/share/keyrings/microsoft.gpg

- name: Add Visual Studio Code repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg]
      https://packages.microsoft.com/repos/code
      stable main
    filename: vscode
    state: present

- name: Install Visual Studio Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
