---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - wget
      - gpg
    state: present
    update_cache: true

- name: Download Google signing key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /usr/share/keyrings/google-chrome.asc
    mode: '0644'

- name: Convert Google key to keyring format
  ansible.builtin.command:
    cmd: >
      gpg --dearmor
      -o /usr/share/keyrings/google-chrome.gpg
      /usr/share/keyrings/google-chrome.asc
  args:
    creates: /usr/share/keyrings/google-chrome.gpg

- name: Add Google Chrome repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg]
      https://dl.google.com/linux/chrome/deb/
      stable main
    filename: google-chrome
    state: present

- name: Install Google Chrome
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present
    update_cache: true
